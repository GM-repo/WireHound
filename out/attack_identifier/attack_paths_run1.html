const cellValue = (col, row) => col.get ? col.get(row) : row[col.k];
const cellText = (col, row) => col.fmt ? col.fmt(row) : (cellValue(col, row) == null ? "" : String(cellValue(col, row)));

function renderSheet() {
  const tabs = $("sheet-tabs"); tabs.innerHTML = "";
  Object.keys(SHEETS).forEach(key => {
    const b = el("button", "tab" + (key === S.sheetTab ? " on" : ""),
      SHEETS[key].label + " (" + SHEETS[key].rows().length + ")");
    b.onclick = () => { S.sheetTab = key; renderSheet(); };
    tabs.appendChild(b);
  });
  const spec = SHEETS[S.sheetTab];
  let rows = spec.rows().slice();
  const sort = S.sheetSort[S.sheetTab];
  if (sort) {
    const col = spec.cols.find(c => c.k === sort.k);
    if (col) rows.sort((a, b) => {
      const va = cellValue(col, a), vb = cellValue(col, b);
      const na = typeof va === "number", nb = typeof vb === "number";
      let r = (na && nb) ? va - vb : String(va == null ? "" : va).localeCompare(String(vb == null ? "" : vb));
      return sort.dir < 0 ? -r : r;
    });
  }
  const body = $("sheet-body"); body.innerHTML = "";
  const t = el("table", "tbl");
  const hr = el("tr");
  spec.cols.forEach(c => {
    const th = el("th", c.num ? "num" : null,
      c.h + (sort && sort.k === c.k ? (sort.dir < 0 ? " ▼" : " ▲") : ""));
    th.onclick = () => {
      const cur = S.sheetSort[S.sheetTab];
      S.sheetSort[S.sheetTab] = { k: c.k, dir: cur && cur.k === c.k ? -cur.dir : 1 };
      renderSheet();
    };
    hr.appendChild(th);
  });
  t.appendChild(el("thead")).appendChild(hr);
  const tb = el("tbody");
  rows.forEach(row => {
    const tr = el("tr");
    spec.cols.forEach(c => tr.appendChild(el("td", c.num ? "num" : null, cellText(c, row))));
    tr.style.cursor = "pointer";
    tr.onclick = () => spec.click(row);
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  body.appendChild(t);
  if (!rows.length) body.appendChild(el("div", null, "Nothing matches the current filters."))
    .style.cssText = "padding:22px 0;color:var(--muted)";
}
function openSheet() { S.sheetOpen = true; $("sheet").classList.add("open"); renderSheet(); }
function closeSheet() { S.sheetOpen = false; $("sheet").classList.remove("open"); }
function downloadCsv() {
  const spec = SHEETS[S.sheetTab];
  const q = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const lines = [spec.cols.map(c => q(c.h)).join(",")];
  spec.rows().forEach(row => lines.push(spec.cols.map(c => q(cellText(c, row))).join(",")));
  const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "netmap-" + S.sheetTab + ".csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

  S.theme = theme;

function wire() {
  $("q").addEventListener("input", (e) => {
    S.query = e.target.value; computeMatches(); updateSearchCount(); renderHud(); invalidate();
  });
  $("q").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const hits = NODES.filter(n => S.matches.has(n.id));
      if (hits.length) { selectNode(hits[0]); fitView(hits); }
    }
  });
  $("layout").addEventListener("change", (e) => {
    S.layout = e.target.value;
    NODES.forEach(n => { n.placed = false; n.pinned = false; });
    seedPositions(); renderLegend(); invalidate();
  });
  $("colorby").addEventListener("change", (e) => {
    S.colorBy = e.target.value; renderLegend(); renderChips(); invalidate();
  });
  $("btn-table").onclick = () => S.sheetOpen ? closeSheet() : openSheet();
  $("sheet-close").onclick = closeSheet;
  $("sheet-csv").onclick = downloadCsv;
  $("sheet").addEventListener("pointerdown", (e) => { if (e.target === $("sheet")) closeSheet(); });
  $("btn-theme").onclick = () => setTheme(S.theme === "dark" ? "light" : "dark");
  $("btn-help").onclick = () => { clearSelection(); toast("Shortcuts are listed in the right-hand panel."); };
  $("z-in").onclick = () => zoomAt(cv.clientWidth / 2, cv.clientHeight / 2, 1.3);
  $("z-out").onclick = () => zoomAt(cv.clientWidth / 2, cv.clientHeight / 2, 1 / 1.3);
  $("z-fit").onclick = () => { fitView(); invalidate(); };

  const bind = (id, key) => $(id).addEventListener("change", (e) => {
    S[key] = e.target.checked;
    recomputeActive(); recomputeEmphasis(); renderHud(); invalidate();
  });
  bind("f-paths", "onlyPaths"); bind("f-cve", "onlyCve"); bind("f-kev", "onlyKev");
  bind("f-window", "onlyWindow"); bind("f-hide", "hideFiltered");
  bind("f-labels", "showLabels"); bind("f-edgelabels", "showEdgeLabels");

  document.querySelectorAll("[data-all]").forEach(b => b.onclick = () => {
    S.zonesOff.clear(); renderChips(); renderHud(); invalidate();
  });
  document.querySelectorAll("[data-none]").forEach(b => b.onclick = () => {
    DATA.zones.forEach(z => S.zonesOff.add(z.id)); renderChips(); renderHud(); invalidate();
  });

  $("tl-play").onclick = () => setPlaying(!S.playing);
  $("tl-prev").onclick = () => stepEvent(-1);
  $("tl-next").onclick = () => stepEvent(1);
  $("tl-speed").onchange = (e) => { S.speed = +e.target.value; };
  $("tl-toggle").onclick = () => {
    const w = $("timewrap"); w.classList.toggle("collapsed");
    $("tl-toggle").innerHTML = w.classList.contains("collapsed") ? "▴" : "▾";
    setTimeout(() => { resize(); invalidate(); }, 30);
  };

  document.addEventListener("keydown", (e) => {
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea") {
      if (e.key === "Escape") e.target.blur();
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    switch (e.key) {
      case "/": e.preventDefault(); $("q").focus(); break;
      case "f": case "F": fitView(); invalidate(); break;
      case "l": case "L": {
        const opts = ["zones", "force", "radial"];
        const next = opts[(opts.indexOf(S.layout) + 1) % opts.length];
        $("layout").value = next; $("layout").dispatchEvent(new Event("change"));
        toast("Layout: " + next); break;
      }
      case "t": case "T": S.sheetOpen ? closeSheet() : openSheet(); break;
      case "d": case "D": setTheme(S.theme === "dark" ? "light" : "dark"); break;
      case " ": e.preventDefault(); setPlaying(!S.playing); break;
      case "ArrowRight": e.preventDefault(); S.selPath ? setHop(S.hop + 1) : stepEvent(1);
        renderPaths(); break;
      case "ArrowLeft": e.preventDefault(); S.selPath ? setHop(S.hop - 1) : stepEvent(-1);
        renderPaths(); break;
      case "Escape":
        if (S.sheetOpen) closeSheet();
        else if (S.selNode || S.selLink) clearSelection();
        else if (S.selPath) selectPath(S.selPath);
        else if (S.win || S.cursor != null) { S.win = null; S.cursor = null;
          recomputeActive(); drawTimeline(); invalidate(); }
        break;
      case "?": clearSelection(); break;
      default: break;
    }
  });

  const ro = new ResizeObserver(() => { resize(); drawTimeline(); invalidate(); });
  ro.observe($("main")); ro.observe($("tl-body"));
  window.addEventListener("resize", () => { resize(); drawTimeline(); invalidate(); });
}

function boot() {
  refreshPalette();
  document.title = DATA.title + " · netmap";
  $("doc-title").textContent = DATA.title;
  $("doc-sub").textContent = DATA.stats.nodes + " assets · " + DATA.stats.paths + " paths · " +
    DATA.stats.events + " events";
  prepare(null);
  seedPositions();
  resize();
  wire();
  computeMatches(); recomputeActive(); recomputeEmphasis();
  renderAll();
  // settle the layout before the first fit so the view is not off-centre
  for (let i = 0; i < 220; i++) simulate();
  fitView();
  S.needsFit = true;
  requestAnimationFrame(loop);
  if (DATA.warnings && DATA.warnings.length)
    toast(DATA.warnings.length + " input note(s) — see the Posture panel", "warn");
}
boot();
</script>
</body>
</html>
